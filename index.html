<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cTB Hautfaltenmessung</title>
<style>
:root{
  --bg:#0a0a0a;--surface:#111;--card:#1a1a1a;--border:#2a2a2a;
  --red:#c0392b;--khaki:#8a8a5a;--grey:#5a5a5a;
  --text:#e8e8e0;--muted:#888880;
  --good:#5a8a5a;--warn:#c8a000;--danger:#c0392b;
  --font:'Segoe UI',system-ui,sans-serif;--mono:'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
.hdr{background:#0d0d0d;border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
.hdr-brand{display:flex;align-items:center;gap:14px}
.hdr-brand img{height:50px;width:auto}
.hdr-brand h1{font-size:.95rem;font-weight:700;letter-spacing:.05em}
.hdr-brand p{font-size:.67rem;color:var(--muted);margin-top:2px}
.hdr-badge{font-size:.62rem;color:var(--khaki);background:var(--card);border:1px solid var(--border);padding:4px 12px;border-radius:20px;font-family:var(--mono)}
.wrap{max-width:980px;margin:0 auto;padding:1.6rem 1.3rem}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1.4rem;overflow-x:auto}
.tab{padding:9px 18px;font-size:.78rem;font-weight:600;cursor:pointer;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;color:var(--muted);background:transparent;transition:all .2s;white-space:nowrap;position:relative;bottom:-1px}
.tab:hover{color:var(--text);background:var(--card)}
.tab.active{color:var(--text);background:var(--card);border-color:var(--border)}
.tab.locked{opacity:.35;cursor:not-allowed}
.tab.has-data::after{content:'●';font-size:.45rem;color:var(--good);position:absolute;top:6px;right:6px}
.tab.verlauf-tab{color:var(--khaki)}
.tab.verlauf-tab.active{border-color:var(--khaki)}
.slabel{font-size:.6rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--khaki);margin-bottom:.9rem;display:flex;align-items:center;gap:10px}
.slabel::after{content:'';flex:1;height:1px;background:var(--border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.3rem;margin-bottom:1.2rem}
.client-badge{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:.7rem 1rem;margin-bottom:1rem;display:flex;gap:1.5rem;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.client-badge strong{color:var(--text)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem}
.fgrid-2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
@media(max-width:600px){.fgrid,.fgrid-2{grid-template-columns:1fr 1fr}}
.field label{display:block;font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:9px 11px;color:var(--text);font-family:var(--mono);font-size:.87rem;outline:none;transition:border-color .2s}
.field input:focus,.field select:focus{border-color:var(--red)}
.field input::placeholder{color:var(--muted);opacity:.4}
.sfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:.65rem}
.sfi{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 11px;transition:border-color .2s}
.sfi:hover{border-color:var(--khaki)}
.sfi-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;gap:5px}
.sfi-name{font-size:.71rem;font-weight:700;color:var(--text);line-height:1.2}
.sfi-kfa{font-size:.54rem;color:var(--red);margin-bottom:4px;font-family:var(--mono)}
.sfi-row{display:flex;align-items:center;gap:7px}
.sfi-row input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:7px 9px;color:var(--text);font-family:var(--mono);font-size:.88rem;outline:none;transition:border-color .2s}
.sfi-row input:focus{border-color:var(--red)}
.sfi-unit{font-size:.65rem;color:var(--muted)}
.bar{margin-top:6px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;width:0%;transition:width .3s,background .3s}
.trend-up{color:#e05040;font-weight:700}
.trend-dn{color:#5a9a5a;font-weight:700}
.trend-eq{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 22px;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;border:none;transition:opacity .15s,transform .1s}
.btn:hover{opacity:.83}.btn:active{transform:scale(.97)}
.btn-go{background:linear-gradient(135deg,var(--red),#8a1a08);color:#fff}
.btn-clr{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-pdf{background:linear-gradient(135deg,var(--khaki),#6a6a40);color:#fff}
.actions{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:.5rem}
.res-section{display:none}
.statrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:.75rem;margin-bottom:1.1rem}
.sbox{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.85rem 1rem}
.sbox .l{font-size:.57rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.sbox .v{font-size:1.45rem;font-weight:700;font-family:var(--mono)}
.sbox .s{font-size:.63rem;color:var(--muted);margin-top:2px}
.ftbl{width:100%;border-collapse:collapse}
.ftbl th{font-size:.57rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:5px 9px;text-align:left;border-bottom:1px solid var(--border)}
.ftbl td{padding:7px 9px;border-bottom:1px solid var(--border);font-size:.77rem;vertical-align:top}
.ftbl tr:last-child td{border-bottom:none}
.ftbl tr:hover td{background:rgba(192,57,43,.04)}
.pbadge{display:inline-block;font-size:.57rem;font-weight:700;padding:2px 8px;border-radius:12px;font-family:var(--mono)}
.p1{background:rgba(192,57,43,.15);color:#e05040;border:1px solid rgba(192,57,43,.3)}
.p2{background:rgba(200,160,0,.12);color:#c8a000;border:1px solid rgba(200,160,0,.3)}
.p3{background:rgba(90,138,90,.12);color:#5a9a5a;border:1px solid rgba(90,138,90,.25)}
.mbar{width:55px;height:4px;background:var(--border);border-radius:2px;overflow:hidden;display:inline-block;vertical-align:middle}
.mbar-f{height:100%;border-radius:2px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
@media(max-width:560px){.pgrid{grid-template-columns:1fr}}
.pbox{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.95rem}
.pbox .pt{font-size:.67rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:7px}
.pbox ul{list-style:none}
.pbox ul li{font-size:.75rem;color:var(--muted);padding:4px 0;border-bottom:1px solid var(--border);display:flex;gap:7px;align-items:flex-start;line-height:1.45}
.pbox ul li:last-child{border-bottom:none}
.pbox ul li::before{content:'›';color:var(--red);flex-shrink:0;font-size:1rem;line-height:1.2}
.gesamtbox{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--red);border-radius:10px;padding:1rem 1.1rem;font-size:.78rem;color:var(--muted);line-height:1.75}
.gesamtbox strong{color:var(--text)}
.verlauf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem}
.vcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem}
.vcard .vc-name{font-size:.72rem;font-weight:700;color:var(--text);margin-bottom:.5rem}
.vcard .vc-row{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;padding:3px 0;border-bottom:1px solid var(--border)}
.vcard .vc-row:last-child{border-bottom:none}
.vcard .vc-label{color:var(--muted)}
.vcard .vc-val{font-family:var(--mono)}
.kfa-timeline{display:flex;align-items:flex-end;gap:6px;height:90px;padding:4px}
.kfa-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:30px}
.kfa-bar-outer{width:100%;background:var(--border);border-radius:4px;overflow:hidden;flex:1;position:relative}
.kfa-bar-inner{position:absolute;bottom:0;width:100%;border-radius:4px}
.kfa-bar-label{font-size:.58rem;color:var(--muted);font-family:var(--mono);text-align:center}
.kfa-bar-pct{font-size:.65rem;font-weight:700;font-family:var(--mono)}
.fnote{font-size:.63rem;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:.55rem .9rem;line-height:1.6;margin-top:.8rem}
.prio-sum{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:1rem}
.prio-sum-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:.5rem .9rem;font-size:.71rem}
.prio-sum-item span{color:var(--red);font-weight:700;margin-right:5px}

/* BAUSTELLEN CARDS */
.baustellen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem}
@media(max-width:760px){.baustellen-grid{grid-template-columns:1fr}}
.bcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.95rem;display:flex;flex-direction:column;gap:.5rem}
.bcard .b-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:.7rem;font-weight:700;font-family:var(--mono);flex-shrink:0}
.bcard .b-head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.bcard .b-title{font-size:.78rem;font-weight:700;color:var(--text)}
.bcard .b-sub{font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--khaki);margin-top:6px}

/* EDITABLE FIELDS */
.editable{outline:1px dashed var(--border);border-radius:7px;padding:.4rem .55rem;cursor:text;transition:outline-color .15s,background .15s}
.editable:hover{outline-color:var(--khaki)}
.editable:focus{outline:1px dashed var(--red);background:rgba(192,57,43,.04)}
.edit-hint{font-size:.6rem;color:var(--muted);font-style:italic;margin-bottom:.6rem;display:flex;align-items:center;gap:5px}

/* MEAL SHEET NOTE */
.mealnote{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--khaki);border-radius:9px;padding:.8rem 1rem;font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:10px}
.mealnote strong{color:var(--text)}
.mealnote .meal-icon{font-size:1.3rem}

/* MESSBEDINGUNGEN */


@media print{
  body{display:none}
}

</style>

function tcmOrganForHour(hour){
  return TCM_CLOCK.find(c=>{
    if(c.start<c.end) return hour>=c.start && hour<c.end;
    return hour>=c.start || hour<c.end; // Übernacht-Slot (23–1 Uhr)
  });
}
// Erkennt aus dem Notizfeld, ob unruhiger Schlaf + eine Uhrzeit erwähnt wird
// (z.B. "wacht um 2 Uhr auf", "unruhig gegen 3:30", "wach um 02:00").
function detectTCMFromNotes(notes){
  if(!notes) return null;
  const lower = notes.toLowerCase();

  // Schlafdauer-Angaben ("6-7 Stunden", "schläft 6 Std.") sind KEINE Aufwachzeit —
  // diese Textteile vorher entfernen, damit sie nicht fälschlich als Uhrzeit erkannt werden.
  const cleaned = lower.replace(/\d{1,2}\s*[-–bis]+\s*\d{1,2}\s*(std\.?|stunden?|h\b)/g, '')
                        .replace(/\d{1,2}\s*(std\.?|stunden?)\b/g, '');

  // Nur ein klarer Aufwach-Kontext zählt: "wacht ... um/gegen <Zeit>" oder
  // "aufwachen/aufgewacht ... um/gegen <Zeit>" oder "wach ... um/gegen <Zeit>".
  // Reines "schläft", "schlaflos" etc. ohne Aufwach-Bezug zählt NICHT.
  const wakePattern = /(wacht|aufwach\w*|aufgewacht|wach\b)[^.;]{0,20}?(um|gegen)\s*(\d{1,2})[:.]?(\d{2})?\s*(uhr)?/;
  const match = cleaned.match(wakePattern);
  if(!match) return null;

  const hour = parseInt(match[3],10);
  if(isNaN(hour) || hour<0 || hour>23) return null;
  const organInfo = tcmOrganForHour(hour);
  if(!organInfo) return null;
  return `TCM-Hinweis: Laut Notizen wacht der Kunde regelmäßig gegen ${hour} Uhr auf — das fällt in die ${organInfo.organ}-Zeit der TCM-Organuhr. ${organInfo.hint}`;
}

// ── ZIEL-KONTEXT: maximaler Fettabbau / Bodycomp ─────────────────────────
// Intervalle, Sprints, Bergsprints, HIIT sind kein Standard-Tool — sie werden
// nur empfohlen, wenn aus Ziel-Feld oder Notizen hervorgeht, dass maximaler
// Fettabbau / optimale Body Composition das erklärte Ziel ist.
function detectMaxFatLossGoal(ziel, notes){
  const combined = `${ziel||''} ${notes||''}`.toLowerCase();
  return /fettabbau|bodycomp|body comp|abnehmen|körperfett.*(senken|reduzieren|runter)|kfa.*(senken|reduzieren|unter)|definition|shred/.test(combined);
}

// ── MITTAGSTIEF-ERKENNUNG: Müdigkeit nach kohlenhydratreichen Mahlzeiten ──
// Auch wenn Rücken+Hüfte ein "Go" für KH geben, kann individuelle postprandiale
// Müdigkeit (Mittagstief, Müdigkeit nach KH-reichem Frühstück) ein Grund sein,
// die KH tagsüber zu reduzieren und auf den Abend zu verlagern.
function detectMittagstief(notes){
  if(!notes) return false;
  const lower = notes.toLowerCase();
  return /müd\w*\s*(nach|durch|wegen)?.*(essen|mahlzeit|mittag|frühstück)|mittagstief|müdigkeit.*essen|nach.*essen.*müd/.test(lower);
}

// ── DIAGNOSE-ERKENNUNG: Leaky-Gut / Histaminintoleranz ───────────────────
// Bei expliziter Diagnose im Notizfeld wird das Glutamin-Protokoll
// progressiver gestaltet (Start niedriger, dann stufenweise steigern).
function detectLeakyGutHistamin(notes){
  if(!notes) return false;
  const lower = notes.toLowerCase();
  return /leaky.?gut|histamin/.test(lower);
}

// ── KH-EMPFEHLUNG: Rücken + Hüfte Logik ──────────────────────────────────
// Rücken = genetische KH-Toleranz (Veranlagung), Hüfte = aktuelle KH-Toleranz /
// Blutzucker-Schwankungen. Maßgeblich ist die SUMME beider Falten:
// Summe < 18mm → klares Go für KH in Kombination mit Protein.
// Summe >= 18mm → individuell schauen: Auswahl der KH (glykämischer Index),
// Zucker/versteckter Zucker reduzieren oder vermeiden (je nach Ziel/Schwere).
function khEmpfehlung(ruecken, huefte, isMale, notes){
  const sum = ruecken + huefte;
  const hatMittagstief = detectMittagstief(notes);

  if(sum < 18){
    let txt = `Rücken (genetische Veranlagung) + Hüfte (aktuelle Toleranz) zusammen = ${sum.toFixed(1)} mm — <strong>klares Go für Kohlenhydrate in Kombination mit Protein.</strong> KH können über den Tag verteilt werden, idealerweise glutenfrei und mit ausreichend Protein kombiniert. Wichtig: Kohlenhydrate müssen verdient werden — die Menge sollte sich am Aktivitätslevel des Tages orientieren (Trainingsintensität, Schritte, allgemeine Alltagsbewegung). An aktiven Tagen mehr, an Ruhetagen entsprechend weniger.`;
    if(hatMittagstief){
      txt += ` <strong>Hinweis aus den Notizen:</strong> Trotz grundsätzlich guter KH-Toleranz wurde Müdigkeit nach Mahlzeiten (Mittagstief) erwähnt — bei Frühstück, Mittagessen und Snacks ist die Kombination aus Protein und Fett die bessere Wahl, um Müdigkeit nach der Mahlzeit zu vermeiden. Den größten Teil der Kohlenhydrate auf das Abendessen verlagern (in Kombination mit Protein) — KH am Abend sorgen für Entspannung und fahren das System runter. Energielevel-Check: "Wie ist Dein Energielevel eine Stunde nach der Mahlzeit auf einer Skala von 1–10 (es gibt keine 7)?" — Ziel ist eine 8 oder höher während des Tages.`;
    }
    return txt;
  }
  return `Rücken + Hüfte zusammen = ${sum.toFixed(1)} mm — die Hüftfalte (aktuelle, durch Lebensstil beeinflussbare KH-Toleranz) zeigt Blutzuckerschwankungen an. Hier zählt vor allem die <strong>Auswahl</strong>: hochglykämische KH, Zucker und versteckter Zucker (Snacks, Fertigprodukte) reduzieren oder — je nach Ziel und Schwere der Problematik — phasenweise vermeiden. KH primär abends, in Kombination mit Protein und bestenfalls glutenfrei. Bei stärkerer Ausprägung kann ein CGM (z.B. Freestyle Libre) für 1–2 Wochen helfen, die individuellen Blutzuckerreaktionen auf einzelne Lebensmittel zu verstehen. Wichtig: Makros nicht vermengen — entweder Kohlenhydrate mit Protein, oder Fett mit Protein, nie alle drei zusammen. Die Rückenfalte selbst ändert sich dabei nur sehr langsam — der Hebel liegt in der Ernährungsauswahl, nicht in einer pauschalen KH-Vermeidung.`;
}

function calcKFA(vals, age, gender) {
  const s = vals.brust + vals.trizeps + vals.ruecken + vals.rippe + vals.huefte + vals.bauch + vals.quad;
  let d = gender==='m'
    ? 1.112-(0.00043499*s)+(0.00000055*s*s)-(0.00028826*age)
    : 1.097-(0.00046971*s)+(0.00000056*s*s)-(0.00012828*age);
  return {kfa:Math.max(2,Math.round((495/d-450)*10)/10), sum7:Math.round(s*10)/10};
}
function calcAge(bd){
  const b=new Date(bd),t=new Date();
  let a=t.getFullYear()-b.getFullYear();
  if(t.getMonth()-b.getMonth()<0||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))a--;
  return a;
}
function getStatus(val,ref){
  const lo = ref[0], hi = ref[1];
  // Bereich zwischen lo und hi wird in zwei Stufen unterteilt (leicht erhöht / verbesserungswürdig),
  // oberhalb von hi ebenfalls in zwei Stufen (kritisch / dringender Handlungsbedarf).
  const midUpper = lo + (hi-lo)*0.5;
  const critUpper = hi + (hi-lo)*0.6; // Schwelle für "dringender Handlungsbedarf", proportional zur Falten-eigenen Spannweite
  if(val<=lo) return {label:'Optimal',prio:5,cls:'p5',col:'#5a9a5a'};
  if(val<=midUpper) return {label:'Leicht erhöht',prio:4,cls:'p4',col:'#8fae4a'};
  if(val<=hi) return {label:'Verbesserungswürdig',prio:3,cls:'p3',col:'#c8a000'};
  if(val<=critUpper) return {label:'Kritisch',prio:2,cls:'p2',col:'#d97a30'};
  return {label:'Dringender Handlungsbedarf',prio:1,cls:'p1',col:'#e05040'};
}
// Rücken = genetische KH-Toleranz. Das ist eine Veranlagung, keine "Baustelle" im
// klassischen Sinn — sie ändert sich kaum und braucht keine Ampel-Eskalation.
// Über der Grenze bedeutet lediglich "geringere genetische Toleranz", nicht "kritisch".
function getStatusGenetic(val,ref){
  if(val<=ref[0]) return {label:'Hohe Toleranz',prio:5,cls:'p5',col:'#5a9a5a'};
  return {label:'Über genet. Grenze',prio:3,cls:'p3',col:'#c8a000'};
}
function trend(cur,prev){
  if(prev===null||prev===undefined||prev===0) return '';
  const d=cur-prev;
  if(Math.abs(d)<0.3) return `<span class="trend-eq">→</span>`;
  if(d>0) return `<span class="trend-up">↑+${d.toFixed(1)}</span>`;
  return `<span class="trend-dn">↓${d.toFixed(1)}</span>`;
}

// ── CALCULATE ─────────────────────────────────────────────────────────────
function calcMeas(i){
  let name,bd,gender,height;
  if(i===0){
    name=document.getElementById('name-0').value.trim()||'Kunde';
    bd=document.getElementById('bd-0').value;
    gender=document.getElementById('gender-0').value;
    height=parseFloat(document.getElementById('height-0').value)||0;
    if(!bd){alert('Bitte Geburtsdatum eingeben.');return;}
    if(!height){alert('Bitte Körpergröße eingeben.');return;}
    clientData={name,bd,gender,height,ziel:document.getElementById('ziel-0').value.trim()};
    for(let j=1;j<6;j++){
      const bn=document.getElementById(`badge-name-${j}`);
      const ba=document.getElementById(`badge-age-${j}`);
      const bg=document.getElementById(`badge-gender-${j}`);
      if(bn)bn.textContent=name;
      if(ba)ba.textContent=calcAge(bd)+' J.';
      if(bg)bg.textContent=gender==='m'?'Männlich':'Weiblich';
    }
  } else {
    if(!clientData){alert('Bitte zuerst Messung 1 ausfüllen.');return;}
    ({name,bd,gender,height}=clientData);
  }

  const weight=parseFloat(document.getElementById(`weight-${i}`).value)||0;
  const mdate=document.getElementById(`mdate-${i}`).value;
  const notes=document.getElementById(`notes-${i}`).value.trim();
  if(!weight){alert('Bitte Körpergewicht eingeben.');return;}

  const isMale=gender==='m';
  const age=calcAge(bd);
  const vals={};
  SF.forEach(s=>{vals[s.id]=parseFloat(document.getElementById(`${s.id}-${i}`).value)||0;});

  const {kfa,sum7}=calcKFA(vals,age,gender);
  const fatkg=Math.round(weight*kfa/100*10)/10;
  const leankg=Math.round((weight-fatkg)*10)/10;
  const bmi=Math.round(weight/((height/100)**2)*10)/10;
  const mdstr=mdate?new Date(mdate).toLocaleDateString('de-DE'):'–';
  const kfaTarget=gender==='m'?[8,15]:[15,22];
  const kfaCol=kfa<=kfaTarget[1]?'#5a9a5a':kfa<=kfaTarget[1]+5?'#c8a000':'#e05040';

  const prev=i>0?measurements[i-1]:null;
  const prevKfa=prev?prev.kfa:null;
  const kfaTrendStr=prev?` · ${trend(kfa,prevKfa)||''}`:' · Erstmessung';

  measurements[i]={name,bd,gender,height,weight,mdate,age,vals,kfa,sum7,fatkg,leankg,bmi,notes};

  // STAT BOXES
  document.getElementById(`statrow-${i}`).innerHTML=`
    <div class="sbox"><div class="l">Kunde</div><div class="v" style="font-size:.9rem">${name}</div><div class="s">${age} J. · ${gender==='m'?'Männlich':'Weiblich'} · ${mdstr}</div></div>
    <div class="sbox"><div class="l">Körperfett</div><div class="v" style="color:${kfaCol}">${kfa}%</div><div class="s">${fatkg} kg${kfaTrendStr}</div></div>
    <div class="sbox"><div class="l">Fettfreie Masse</div><div class="v" style="color:var(--khaki)">${leankg} kg</div><div class="s">von ${weight} kg</div></div>
    <div class="sbox"><div class="l">BMI</div><div class="v">${bmi}</div><div class="s">${bmi<18.5?'Untergewicht':bmi<25?'Normalgewicht':bmi<30?'Übergewicht':'Adipositas'}</div></div>
    <div class="sbox"><div class="l">Summe 7 Falten</div><div class="v">${sum7} mm</div><div class="s">KFA-Basis</div></div>
    <div class="sbox"><div class="l">KFA-Zielbereich</div><div class="v" style="font-size:.9rem">${kfaTarget[0]}–${kfaTarget[1]}%</div><div class="s">Diff: ${Math.max(0,kfa-kfaTarget[1]).toFixed(1)}%</div></div>`;

  // ZIEL-HINWEIS
  const zielEl=document.getElementById(`zielnote-${i}`);
  if(clientData.ziel){
    zielEl.style.display='block';
    zielEl.innerHTML=`🎯 <strong>Ziel:</strong> ${clientData.ziel}`;
  } else {
    zielEl.style.display='none';
  }

  // KFA-ZU-NIEDRIG-WARNUNG (essentielles Fett: ca. 6% Männer, ca. 14% Frauen)
  const kfaMin = gender==='m' ? 8 : 14;
  const kfaWarnEl = document.getElementById(`kfawarning-${i}`);
  if(kfa < kfaMin){
    kfaWarnEl.style.display='block';
    kfaWarnEl.innerHTML = `⚠ <strong>KFA-Hinweis:</strong> Mit ${kfa}% liegt der Körperfettanteil unter dem empfohlenen Minimum für ein gut funktionierendes Immunsystem und einen gesunden Hormonhaushalt. Empfehlung: Kalorienzufuhr im Gesamtbild erhöhen, Fett-Protein-Kombination als Snack in den Alltag integrieren. Supplements ggf. reduzieren (z.B. Chlorella raus, Multikomplex auf 3x1, Vitamin D Wert testen lassen).`;
  } else {
    kfaWarnEl.style.display='none';
  }

  // NOTIZEN-KARTE
  const notesCard=document.getElementById(`notescard-${i}`);
  const notesDisplay=document.getElementById(`notesdisplay-${i}`);
  if(notes){
    notesCard.style.display='block';
    notesDisplay.textContent=notes;
  } else {
    notesCard.style.display='none';
  }

  // Hinweis: Berechnungsformel ist bewusst nicht im Output enthalten (intern)

  // FALTEN TABELLE
  const refKey=gender==='m'?'ref_m':'ref_f';
  const recKey=gender==='m'?'rec_m':'rec_f';
  const gutKey=gender==='m'?'gut_m':'gut_f';
  const tbody=document.getElementById(`ftbody-${i}`);
  tbody.innerHTML='';
  const hits={};
  const foldPrio={};
  SF.forEach(s=>{
    const val=vals[s.id];
    const st=s.id==='ruecken'?getStatusGenetic(val,s[refKey]):getStatus(val,s[refKey]);
    foldPrio[s.id]=st.prio;
    const pct=Math.min(val/40*100,100);
    if(!hits[st.prio])hits[st.prio]=[];
    hits[st.prio].push(s.name);
    const rec=st.prio<=3?s[recKey]:s[gutKey];
    const prevVal=prev?prev.vals[s.id]:null;
    const tr=i>0?`<td style="font-family:var(--mono);font-size:.72rem">${prevVal>0?prevVal+' mm':'–'}</td><td>${trend(val,prevVal)}</td>`:'';
    tbody.innerHTML+=`
      <tr>
        <td><strong>${s.name}</strong>${s.kfa?'<span style="font-size:.53rem;color:var(--red);margin-left:4px">KFA</span>':''}</td>
        <td style="font-size:.68rem;color:var(--muted)">${(isMale?s.ind_m:s.ind_f)||s.ind}</td>
        <td style="font-family:var(--mono);color:${st.col}">${val>0?val+' mm':'–'}</td>
        ${tr}
        <td><span class="pbadge" style="background:${st.col}22;color:${st.col};border:1px solid ${st.col}55">${st.label}</span></td>
        <td style="font-family:var(--mono);font-size:.63rem;color:var(--muted)">P${st.prio}</td>
        <td><span class="mbar"><span class="mbar-f" style="width:${pct}%;background:${st.col}"></span></span></td>
      </tr>
      <tr><td colspan="${i>0?8:6}" class="editable" contenteditable="true" style="font-size:.7rem;color:var(--muted);padding:6px 9px;border-bottom:1px solid var(--border)">${rec}</td></tr>`;
  });

  // PRIO SUMMARY
  const ps=document.getElementById(`priosum-${i}`);
  ps.innerHTML='';
  if(hits[1]&&hits[1].length) ps.innerHTML+=`<div class="prio-sum-item"><span>Prio 1 · Dringender Handlungsbedarf</span>${hits[1].join(', ')}</div>`;
  if(hits[2]&&hits[2].length) ps.innerHTML+=`<div class="prio-sum-item"><span>Prio 2 · Kritisch</span>${hits[2].join(', ')}</div>`;
  if(hits[3]&&hits[3].length) ps.innerHTML+=`<div class="prio-sum-item"><span>Prio 3 · Verbesserungswürdig</span>${hits[3].join(', ')}</div>`;
  if(hits[4]&&hits[4].length) ps.innerHTML+=`<div class="prio-sum-item" style="opacity:.75"><span>Prio 4 · Leicht erhöht</span>${hits[4].join(', ')}</div>`;
  if(hits[5]&&hits[5].length) ps.innerHTML+=`<div class="prio-sum-item" style="opacity:.6"><span>Prio 5 · Optimal</span>${hits[5].join(', ')}</div>`;

  // ── THEMEN-SCORING: Top 3 Prioritäten ermitteln ─────────────────────────
  const v=vals;
  const themeScores={};
  Object.keys(THEME_MAP).forEach(foldId=>{
    const theme=THEME_MAP[foldId];
    const p=foldPrio[foldId];
    // Punkte: Prio 1 (Dringender Handlungsbedarf)=4, Prio 2 (Kritisch)=3, Prio 3 (Verbesserungswürdig)=2, Prio 4 (Leicht erhöht)=1, Prio 5 (Optimal)=0
    const pts = p===1?4 : p===2?3 : p===3?2 : p===4?1 : 0;
    themeScores[theme]=(themeScores[theme]||0)+pts;
  });
  const sortedThemes=Object.keys(THEMES).map(key=>({key,score:themeScores[key]||0}))
    .sort((a,b)=>b.score-a.score);
  const activeThemes=sortedThemes.filter(t=>t.score>0).slice(0,3);
  const topThemes=activeThemes.length?activeThemes:sortedThemes.slice(0,0); // leer wenn alles optimal

  // ── PRIORITÄTEN-KARTEN (absteigend: Priorität 1 = wichtigste) ───────────
  const bgrid=document.getElementById(`baustellen-${i}`);
  if(topThemes.length){
    bgrid.innerHTML=topThemes.map((t,idx)=>{
      const th=THEMES[t.key];
      let ls=isMale?th.lifestyle_m:th.lifestyle_f;
      let er=isMale?th.ernaehrung_m:th.ernaehrung_f;
      if(t.key==='blutzucker'){
        er = khEmpfehlung(v.ruecken, v.huefte, isMale, notes) + ' ' + er;
      }
      if(t.key==='leber'){
        const tcmHint = detectTCMFromNotes(notes);
        if(tcmHint) ls = tcmHint + ' ' + ls;
        if(detectLeakyGutHistamin(notes)){
          er += ' <strong>Hinweis aus den Notizen:</strong> Bei diagnostiziertem Leaky-Gut bzw. Histaminintoleranz das Glutamin-Komplex-Protokoll vorsichtiger und progressiver gestalten — z.B. mit 10g/Tag starten und alle paar Tage stufenweise auf 20–30g steigern, statt direkt mit der vollen Dosis zu beginnen.';
        }
      }
      return `<div class="bcard">
        <div class="b-head"><span class="b-num">${idx+1}</span><span class="b-title">Priorität ${idx+1}: ${th.name}</span></div>
        <div class="b-sub">Lifestyle</div>
        <div class="editable" contenteditable="true" style="font-size:.74rem;color:var(--muted);line-height:1.5">${ls}</div>
        <div class="b-sub">Ernährung</div>
        <div class="editable" contenteditable="true" style="font-size:.74rem;color:var(--muted);line-height:1.5">${er}</div>
      </div>`;
    }).join('');
  } else {
    bgrid.innerHTML=`<div class="bcard" style="grid-column:1/-1">
      <div class="b-head"><span class="b-num" style="background:#5a9a5a">✓</span><span class="b-title">Keine akuten Prioritäten — Fokus auf Erhalt</span></div>
      <div class="editable" contenteditable="true" style="font-size:.74rem;color:var(--muted);line-height:1.5">Prinzipiell sind alle Falten in einer sehr guten Range. Basics konsequent weiter, Fokus auf Trainingsprogress und Konstanz in der Ernährung.</div>
    </div>`;
  }

  // ── SUPPLEMENT-PLAN (max. 4 nach M1, max. 5 ab M2) ──────────────────────
  const maxSupps=i===0?4:5;
  const supps=[];

  // Basic 1: Multikomplex (Dosierung je Geschlecht & Messung)
  if(isMale){
    supps.push('YPSI Multikomplex 3x2 zu den Mahlzeiten');
  } else if(i===0){
    supps.push('YPSI Multikomplex 3x1 zu einer Mahlzeit (Zink kann morgens Übelkeit auslösen — daher immer mit einer Mahlzeit einnehmen)');
  } else {
    const prevHadMulti1x=prev && prev.suppFlags && prev.suppFlags.multi1x;
    supps.push(prevHadMulti1x?'YPSI Multikomplex jetzt auf 3x2 zu den Mahlzeiten steigern (gute Verträglichkeit bei 3x1)':'YPSI Multikomplex 3x2 zu den Mahlzeiten');
  }

  // Basic 3: Magnesium-Tri-Komplex / GABA-Mag (Switch erst ab M2, wenn Schlaf weiter Thema)

    if(supps.length>=maxSupps) return;

  topThemes.forEach(t=>{
    if(supps.length>=maxSupps) return;
    if(t.key==='testosteron' && isMale && !supps.some(s=>s.includes('Zink-Komplex'))){
      supps.push('Zink-Komplex zusätzlich für 2–3 Wochen');
    }
  });

  // Flags für Folgemessung merken (z.B. Multikomplex 3x1 bei Frauen)
  measurements[i].suppFlags={multi1x: !isMale && i===0};

  document.getElementById(`supplist-${i}`).innerHTML=supps.slice(0,maxSupps).map(s=>`<li>${s}</li>`).join('')
    + `<li style="color:var(--muted);font-size:.7rem;font-style:italic">Alle YPSI Supplements: ypsi.de — Code CTBSTRONG = 5% Rabatt</li>`;

  // ── TRAINING-BOX (statisch + Intervalle nur bei erkennbarem Fettabbau-Ziel) ──
  let trainingText = 'Fokus auf schweres Krafttraining: Kniebeugen, Kreuzheben, Bankdrücken, Klimmzüge, Nackendrücken. Gewichte wöchentlich notieren und steigern — Leistungsprogress ist der entscheidende Hebel. Mind. 2 Ruhetage/Woche für ausreichende Regeneration.';
  if(detectMaxFatLossGoal(clientData.ziel, notes)){
    trainingText += ' Da maximaler Fettabbau/Bodycomp das Ziel ist: zusätzlich Intervalle bzw. HIIT 2x pro Woche einbauen (AirBike, Sprints oder Bergsprints) — das unterstützt Stoffwechselrate und Fettverbrennung zusätzlich zum Krafttraining.';
  }
  document.getElementById(`trainingbox-${i}`).innerHTML = trainingText;

  // ── MEAL-SHEET HINWEIS (rotiert nach Messung) ───────────────────────────
  const mealSheets=[
    {icon:'🍳', label:'Frühstücks-Sheet'},
    {icon:'🥗', label:'Mittags-Sheet'},
    {icon:'🍽️', label:'Abend-Sheet'},
    {icon:'🥤', label:'Snack-Sheet'},
    {icon:'🥤', label:'Snack-Sheet'},
    {icon:'🥤', label:'Snack-Sheet'},
  ];
  const ms=mealSheets[i];
  document.getElementById(`mealnote-${i}`).innerHTML=
    `<span class="meal-icon">${ms.icon}</span><div class="editable" contenteditable="true">Heute mitgeben: <strong>${ms.label}</strong><br>Ein Schritt nach dem anderen — so bleibt der Kunde nachhaltig dabei.</div>`;

  // ── GESAMTTEXT (kompakt, Deine Sprache) ─────────────────────────────────
  let gt='';
  if(prev&&i>0){
    const imp=[],wors=[];
    SF.forEach(s=>{
      const cur=vals[s.id],pv=prev.vals[s.id];
      if(cur>0&&pv>0){if(cur<pv-0.5)imp.push(s.name);else if(cur>pv+0.5)wors.push(s.name);}
    });
    if(imp.length) gt+=`<strong>Schöne Entwicklung!</strong> Verbessert: ${imp.join(', ')}. `;
    if(wors.length) gt+=`Mehr Aufmerksamkeit bei: ${wors.join(', ')}. `;
    const kfaDiff=kfa-prev.kfa;
    gt+=`KFA: ${prev.kfa}% zu <strong>${kfa}%</strong> (${kfaDiff<0?'Verbesserung um '+Math.abs(kfaDiff).toFixed(1)+'% — stark, genau so weiter!':kfaDiff>0?'Anstieg um '+kfaDiff.toFixed(1)+'% — Strategie anpassen':'unverändert'}). `;
    gt+=`Gewicht: ${prev.weight} kg zu ${weight} kg.<br><br>`;
  }
  if(topThemes.length){
    gt+=`Die <strong>3 Prioritäten</strong> für diese Phase: ${topThemes.map((t,idx)=>`${idx+1}) ${THEMES[t.key].name}`).join(', ')}. Wir gehen das gezielt mit den oben aufgeführten Lifestyle-, Ernährungs- und Supplement-Maßnahmen an — Schritt für Schritt, damit es nachhaltig dranbleibt. `;
  } else {
    gt+=`Prinzipiell sind bei Dir ziemlich alle Falten in einer sehr guten Range — Fokus liegt auf Erhalt und Trainingsprogress. `;
  }
  const blutzuckerIsTop=topThemes.some(t=>t.key==='blutzucker');
  if(!blutzuckerIsTop){
    if(detectMittagstief(notes)){
      gt+=`Kohlenhydrate passen grundsätzlich gut in Deine Ernährung (Rücken + Hüfte geben ein Go) — aus den Notizen geht aber Müdigkeit nach Mahlzeiten (Mittagstief) hervor. Daher: KH tagsüber reduzieren, stattdessen auf Protein + Fett setzen, und den größten Teil der Kohlenhydrate auf das Abendessen verlagern (in Kombination mit Protein) — das hilft, abends zu entspannen und das System runterzufahren. Energielevel-Check eine Stunde nach der Mahlzeit (Skala 1–10, keine 7) — Ziel ist eine 8 oder höher. `;
    } else {
      gt+=`Kohlenhydrate passen gut in Deine Ernährung — denk dabei daran, dass sie verdient werden: die Menge sollte sich am Aktivitätslevel des Tages orientieren (Trainingsintensität, Schritte, Alltagsbewegung). `;

  }
  gt+=`Die Basics (Multikomplex, Vitamin D/K, Magnesium-Tri-Komplex) bleiben die Grundlage. Protein: ${isMale?'2,0–2,5':'1,6–2,0'} g/kg Körpergewicht täglich — eine Hand in Länge-Breite-Höhe pro Hauptmahlzeit, Proteinquellen rollieren. Generelle Makro-Kombination: entweder Kohlenhydrate mit Protein, oder Fett mit Protein — die Kombination Kohlenhydrate + Fett möglichst vermeiden. Jede Mahlzeit sollte ca. 30–40 g Protein enthalten. Die Supps bekommst Du bei ypsi.de — mit dem Code <strong>CTBSTRONG</strong> bekommst Du 5% Rabatt auf Deinen Warenkorb.`;
  if(clientData.ziel){
    gt+=`<br><br><strong>Zu Deinem Ziel (${clientData.ziel}):</strong> Je höher und ambitionierter das Ziel gesteckt ist, desto genauer müssen die Vorgaben umgesetzt werden — Konsequenz bei Ernährung, Training und Supplements ist hier der entscheidende Hebel.`;
  }
  document.getElementById(`gesamtbox-${i}`).innerHTML=gt;

  document.getElementById(`form-${i}`).style.display='none';
  document.getElementById(`res-${i}`).style.display='block';
  markTabDone(i);

}

function renderVerlauf(){
  const done=measurements.filter(Boolean);
  if(!done.length){document.getElementById('kfa-chart').innerHTML='<p style="color:var(--muted);font-size:.8rem">Noch keine Messungen vorhanden.</p>';return;}
  const maxKfa=Math.max(...done.map(m=>m.kfa),1);
  let ch='';
  done.forEach((m,idx)=>{
    const h=Math.round(m.kfa/maxKfa*100);
    const col=m.kfa<=15?'#5a8a5a':m.kfa<=22?'#c8a000':'#c0392b';
    const dt=m.mdate?new Date(m.mdate).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}):`M${idx+1}`;
    ch+=`<div class="kfa-bar-wrap">
      <div class="kfa-bar-pct" style="color:${col}">${m.kfa}%</div>
      <div class="kfa-bar-outer"><div class="kfa-bar-inner" style="height:${h}%;background:${col}"></div></div>
      <div class="kfa-bar-label">${dt}</div>
    </div>`;
  });
  document.getElementById('kfa-chart').innerHTML=ch;

  let tbl=`<table class="ftbl"><thead><tr><th>Messung</th><th>Datum</th><th>Gewicht</th><th>KFA</th><th>Fettmasse</th><th>Fettfrei</th><th>BMI</th><th>Summe 7</th></tr></thead><tbody>`;
  done.forEach((m,idx)=>{
    const prev=idx>0?done[idx-1]:null;
    tbl+=`<tr>
      <td><strong>Messung ${idx+1}</strong></td>
      <td>${m.mdate?new Date(m.mdate).toLocaleDateString('de-DE'):'–'}</td>
      <td style="font-family:var(--mono)">${m.weight} kg</td>
      <td style="font-family:var(--mono);color:${m.kfa<=15?'#5a9a5a':m.kfa<=22?'#c8a000':'#e05040'}">${m.kfa}% ${trend(m.kfa,prev?prev.kfa:null)}</td>
      <td style="font-family:var(--mono)">${m.fatkg} kg</td>
      <td style="font-family:var(--mono)">${m.leankg} kg</td>
      <td style="font-family:var(--mono)">${m.bmi}</td>
      <td style="font-family:var(--mono)">${m.sum7} mm</td>
    </tr>`;
  });
  tbl+=`</tbody></table>`;
  document.getElementById('verlauf-table').innerHTML=tbl;

  const refK=clientData&&clientData.gender==='m'?'ref_m':'ref_f';
  let fhtml='';
  SF.forEach(s=>{
    fhtml+=`<div class="vcard"><div class="vc-name">${s.name}${s.kfa?' <span style="font-size:.55rem;color:var(--red)">KFA</span>':''}</div>`;
    done.forEach((m,idx)=>{
      const val=m.vals[s.id];
      const prev=idx>0?done[idx-1].vals[s.id]:null;
      const st=getStatus(val,s[refK]);
      fhtml+=`<div class="vc-row"><span class="vc-label">M${idx+1}</span><span class="vc-val" style="color:${st.col}">${val>0?val+' mm':'–'} ${idx>0?trend(val,prev):''}</span></div>`;
    });
    fhtml+='</div>';
  });
  document.getElementById('verlauf-falten').innerHTML=fhtml;
}

// ── PDF-DOWNLOAD: native jsPDF-Textlayout (zuverlässig, kein Canvas-Rendering) ──
function downloadPDF(i){

  catch(e){
    console.error('PDF-Fehler:', e);
    alert('PDF konnte nicht erstellt werden.\nFehler: '+(e&&e.message?e.message:e)+(e&&e.stack?'\n'+String(e.stack).split('\n').slice(0,3).join('\n'):''));
  }

function downloadPDFCore(i){
  const m=measurements[i];
  if(!m){alert('Bitte zuerst Auswertung erstellen.');return;}
  if(!window.jspdf){alert('PDF-Bibliothek konnte nicht geladen werden — bitte Internetverbindung prüfen.');return;}

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm',format:'a4'});
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const marginX = 16;
  const contentW = pageW - marginX*2;
  let y = 16;

  const colText   = [26,26,26];
  const colMuted  = [120,118,108];
  const colRed    = [192,57,43];
  const colKhaki  = [120,118,80];
  const colLine   = [228,225,216];
  const colGood   = [70,130,70];
  const colWarn   = [180,140,0];
  const colDanger = [200,60,40];
  const colBoxBg  = [248,247,243];

  function checkPageBreak(extra){
    if(y + extra > pageH - 14){
      doc.addPage();
      y = 16;
    }
  }
  function setColor(c){doc.setTextColor(c[0],c[1],c[2]);}
  function hexToRgb(hex){
    const h = hex.replace('#','');
    return [parseInt(h.substring(0,2),16), parseInt(h.substring(2,4),16), parseInt(h.substring(4,6),16)];
  }
  function kfaStatusColor(val, ref){
    if(val<=ref[0]) return colGood;
    if(val<=ref[1]) return colWarn;
    return colDanger;
  }
  function heading(text, opts={}){
    checkPageBreak(10);
    y += opts.topGap!==undefined?opts.topGap:3;
    setColor(colText);
    doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
    doc.text(text.toUpperCase(), marginX, y);
    doc.setDrawColor(colRed[0],colRed[1],colRed[2]);
    doc.setLineWidth(0.6);
    doc.line(marginX, y+1.6, marginX+contentW, y+1.6);
    y += 7;
  }
  function paragraph(text, opts={}){
    if(!text || !text.trim()) return 0;
    const size = opts.size||9.5;
    const color = opts.color||colMuted;
    const bold = opts.bold||false;
    const gap = opts.gap!==undefined?opts.gap:4;
    const width = opts.width||contentW;
    const x = opts.x||marginX;
    // jsPDF line height: fontSize in pt, 1pt = 0.353mm, plus ~20% leading
    const lineH = size * 0.353 * 1.25;
    doc.setFont('helvetica', bold?'bold':'normal');
    doc.setFontSize(size);
    setColor(color);
    const lines = doc.splitTextToSize(text, width);
    checkPageBreak(lines.length*lineH + gap + 2);
    doc.text(lines, x, y);
    y += lines.length*lineH + gap;
    return lines.length;
  }
  // Liest Text aus (editierbaren) HTML-Elementen und erhält Zeilenumbrüche:
  // <br> und Block-Elemente (div, p, li) werden zu \n — sonst kleben Zeilen/Absätze,
  // die im Tool per Enter eingefügt wurden, im PDF zusammen.
  function htmlToText(html){
    const tmp=document.createElement('div');
    tmp.innerHTML=html;
    tmp.querySelectorAll('br').forEach(b=>b.replaceWith('\n'));
    const BLOCK=/^(DIV|P|LI|TR|H1|H2|H3|H4|UL|OL)$/;
    tmp.querySelectorAll('div,p,li,tr,h1,h2,h3,h4').forEach(b=>{
      // Chrome: erste Zeile steht als nackter Text, Folgezeilen als <div> -> Umbruch davor setzen
      const prev=b.previousSibling;
      if(prev && !(prev.nodeType===1 && BLOCK.test(prev.nodeName))) b.before('\n');
      b.append('\n');
    });
    return (tmp.textContent||'')
      .replace(/\u00a0/g,' ')
      .replace(/[ \t]+/g,' ')
      .replace(/ *\n */g,'\n')
      .replace(/\n{3,}/g,'\n\n')
      .trim();
  }
  function stripTags(html){ return htmlToText(html); }
  function elText(el){
    if(!el) return '';
    try{ return htmlToText(el.innerHTML); }
    catch(e){ console.warn('htmlToText Fallback', e); return (el.innerText||el.textContent||'').trim(); }
  }
  // jsPDF + Helvetica kann Emojis nicht rendern (führt teils zu leeren/defekten PDFs).
  // Daher vor jeder Textausgabe Emojis entfernen bzw. durch Text ersetzen.
  function cleanForPDF(text){
    if(typeof text !== 'string') return text;
    return text
      .replace(/🎯/g, '')
      .replace(/📅/g, '')
      .replace(/💪/g, '')
      .replace(/🏃/g, '')
      .replace(/🥗/g, '')
      .replace(/💊/g, '')
      // Fallback: alle verbleibenden Emoji/Symbol-Unicode-Bereiche entfernen
      .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}]/gu, '')
      .replace(/[ \t]{2,}/g, ' ')
      .replace(/ *\n */g, '\n')
      .trim();
  }

  const refKey = m.gender==='m'?'ref_m':'ref_f';
  const mdstr = m.mdate?new Date(m.mdate).toLocaleDateString('de-DE'):'–';
  const prev = i>0?measurements[i-1]:null;

  // ── HEADER ──────────────────────────────────────────────────────────────
  doc.setFont('helvetica','bold'); doc.setFontSize(17);
  setColor(colText);
  doc.text('Deine Auswertung', marginX, y);
  y += 6.5;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  setColor(colMuted);
  doc.text(`Messung ${i+1} · ${mdstr} · CTB Coaching · headcoachtobi@gmail.com`, marginX, y);
  y += 6;
  doc.setDrawColor(colLine[0],colLine[1],colLine[2]);
  doc.setLineWidth(0.4);
  doc.line(marginX,y,marginX+contentW,y);
  y += 7;

  // Name/Alter/Geschlecht + Ziel
  doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
  setColor(colText);
  doc.text(`${m.name}`, marginX, y);
  const nameWidth = doc.getTextWidth(m.name);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  setColor(colMuted);
  doc.text(`${m.age} Jahre · ${m.gender==='m'?'Männlich':'Weiblich'}`, marginX+nameWidth+4, y);
  y += 7;

  if(clientData && clientData.ziel){
    paragraph(cleanForPDF(`Ziel: ${clientData.ziel}`), {size:9.5, color:colText, gap:3});
  }
  if(prev){
    const kfaDiff = m.kfa-prev.kfa;
    const arrowTxt = kfaDiff<0?`Verbesserung um ${Math.abs(kfaDiff).toFixed(1)}%`:kfaDiff>0?`+${kfaDiff.toFixed(1)}%`:'unverändert';
    paragraph(cleanForPDF(`Vorherige Messung (${prev.mdate?new Date(prev.mdate).toLocaleDateString('de-DE'):'–'}): KFA ${prev.kfa}% zu jetzt ${m.kfa}% (${arrowTxt}) · Gewicht ${prev.weight} kg zu ${m.weight} kg`), {size:9, gap:4});
  }
  y += 1;

  // ── KÖRPERKOMPOSITION (KFA prominent) ──────────────────────────────────
  checkPageBreak(28);
  doc.setFillColor(colBoxBg[0],colBoxBg[1],colBoxBg[2]);
  doc.setDrawColor(colLine[0],colLine[1],colLine[2]);
  doc.roundedRect(marginX, y, contentW, 24, 2.5, 2.5, 'FD');

  // KFA big number, left third
  const kfaBoxW = contentW*0.32;
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  setColor(colKhaki);
  doc.text('KÖRPERFETTANTEIL (KFA)', marginX+6, y+8);
  doc.setFont('helvetica','bold'); doc.setFontSize(22);
  setColor(kfaStatusColor(m.kfa, m.gender==='m'?[15,20]:[22,28]));
  doc.text(`${m.kfa}%`, marginX+6, y+19);

  // vertical divider
  doc.setDrawColor(colLine[0],colLine[1],colLine[2]);
  doc.line(marginX+kfaBoxW, y+4, marginX+kfaBoxW, y+20);

  // remaining stats, right two-thirds in a 3-col mini grid
  const miniStats = [
    ['Fettmasse', m.fatkg+' kg'],
    ['Fettfreie Masse', m.leankg+' kg'],
    ['Gewicht', m.weight+' kg'],
  ];
  const miniW = (contentW-kfaBoxW-6)/3;
  miniStats.forEach((s,idx)=>{
    const bx = marginX+kfaBoxW+6+idx*miniW;
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    setColor(colKhaki);
    doc.text(s[0], bx, y+8);
    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    setColor(colText);
    doc.text(s[1], bx, y+17);
  });
  y += 30;

  // ── KFA-HINWEIS (editierbar; nur wenn im Tool sichtbar) ─────────────────
  const kfaWarnEl = document.getElementById(`kfawarning-${i}`);
  const kfaWarnPDF = (kfaWarnEl && kfaWarnEl.style.display!=='none') ? cleanForPDF(elText(kfaWarnEl)) : '';
  if(kfaWarnPDF){
    const kwSize = 9, kwLineH = kwSize*0.353*1.25;
    doc.setFont('helvetica','normal'); doc.setFontSize(kwSize);
    const kwLines = doc.splitTextToSize(kfaWarnPDF, contentW-10);
    const kwH = kwLines.length*kwLineH + 8;
    checkPageBreak(kwH+6);
    doc.setFillColor(253,250,242);
    doc.setDrawColor(239,230,207);
    doc.setLineWidth(0.4);
    doc.roundedRect(marginX, y, contentW, kwH, 2.5, 2.5, 'FD');
    doc.setDrawColor(colWarn[0],colWarn[1],colWarn[2]);
    doc.setLineWidth(1.2);
    doc.line(marginX, y+1.2, marginX, y+kwH-1.2);
    setColor(colText);
    doc.text(kwLines, marginX+5, y+6);
    y += kwH + 6;
  }

  // ── NOTIZEN ZUM KUNDEN (editierbar, ging bisher im PDF verloren) ────────
  const notesDisplayEl = document.getElementById(`notesdisplay-${i}`);
  const notesTextPDF = notesDisplayEl ? cleanForPDF(stripTags(notesDisplayEl.innerHTML)) : '';
  if(notesTextPDF){
    heading('Notizen zum Kunden');
    paragraph(notesTextPDF, {size:9, color:colText, gap:4});
  }

  // ── HAUTFALTEN-WERTE (farblich, wie gewohnt) ────────────────────────────
  heading('Deine Hautfalten-Werte');
  const colW = [46, contentW-46-26-26, 26, 26];
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
  setColor(colKhaki);
  let cx = marginX;
  ['FALTE','INDIKATOR','WERT','STATUS'].forEach((h,idx)=>{
    doc.text(h, cx, y);
    cx += colW[idx];
  });
  y += 2;
  doc.setDrawColor(colLine[0],colLine[1],colLine[2]);
  doc.line(marginX, y, marginX+contentW, y);
  y += 4;

  SF.forEach(s=>{
    checkPageBreak(6);
    const val = m.vals[s.id];
    const ref = s[refKey];
    const isGenetic = s.id==='ruecken';
    const st = isGenetic ? getStatusGenetic(val,ref) : getStatus(val,ref);
    const col = hexToRgb(st.col);
    const statusLabel = st.label;
    const indText = (m.gender==='m'?s.ind_m:s.ind_f)||s.ind;

    cx = marginX;
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
    setColor(colText);
    doc.text(s.name, cx, y);
    cx += colW[0];

    doc.setFont('helvetica','normal'); doc.setFontSize(7);
    setColor(colMuted);
    const indLines = doc.splitTextToSize(indText, colW[1]-2);
    doc.text(indLines[0]||'', cx, y);
    cx += colW[1];

    doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
    setColor(col);
    doc.text(val>0?val+' mm':'–', cx, y);
    cx += colW[2];

    doc.setFont('helvetica','normal'); doc.setFontSize(7);
    setColor(col);
    doc.text(statusLabel, cx, y);

    y += 5.5;
  });
  y += 3;

  // ── TOP 3 PRIORITÄTEN ────────────────────────────────────────────────────
  heading('Deine Top 3 Prioritäten');
  const prioCards = document.querySelectorAll(`#baustellen-${i} .bcard`);
  if(prioCards.length){
    prioCards.forEach((card,idx)=>{
      const title = cleanForPDF(card.querySelector('.b-title')?.textContent || `Priorität ${idx+1}`);
      const subs = card.querySelectorAll('.b-sub');
      const editables = card.querySelectorAll('.editable');
      checkPageBreak(16);

      // numbered red circle + title
      doc.setFillColor(colRed[0],colRed[1],colRed[2]);
      doc.circle(marginX+2.5, y+1.5, 2.6, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(8);
      doc.setTextColor(255,255,255);
      doc.text(String(idx+1), marginX+2.5, y+2.5, {align:'center'});

      doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
      setColor(colText);
      doc.text(title, marginX+7, y+2.5);
      y += 7;

      subs.forEach((sub,sidx)=>{
        const subLabel = cleanForPDF(sub.textContent);
        const bodyText = editables[sidx]?cleanForPDF(elText(editables[sidx])):'';
        checkPageBreak(8);
        doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
        setColor(colKhaki);
        doc.text(subLabel.toUpperCase(), marginX+7, y);
        y += 4;
        paragraph(bodyText, {size:9, color:colText, gap:3, x:marginX+7, width:contentW-7});
      });
      y += 1.5;
      doc.setDrawColor(colLine[0],colLine[1],colLine[2]);
      doc.line(marginX, y, marginX+contentW, y);
      y += 4;
    });
  } else {
    paragraph('Prinzipiell sind alle Falten in einer sehr guten Range. Fokus auf Erhalt und Trainingsprogress.', {size:9.5});
  }

  // ── SUPPLEMENT-PLAN ──────────────────────────────────────────────────────
  heading('Supplement-Plan');
  // Zeilen aus dem editierbaren Feld lesen (egal ob <li>, <div> oder <br> — vom Browser je nach Bearbeitung erzeugt)
  const suppEl = document.getElementById(`supplist-${i}`);
  const suppLines = elText(suppEl).split('\n').map(t=>cleanForPDF(t.replace(/^[•\-–]\s*/,'').trim())).filter(Boolean);
  suppLines.forEach(line=>{
    checkPageBreak(6);
    doc.setFont('helvetica','bold'); doc.setFontSize(9);
    setColor(colRed);
    doc.text('•', marginX, y);
    paragraph(line, {size:9, color:colText, gap:3, x:marginX+4, width:contentW-4});
  });
  y += 2;

  // ── TRAINING & MEAL-SHEET (editierbar, ging bisher im PDF verloren) ─────
  const trainingEl = document.getElementById(`trainingbox-${i}`);
  const trainingTextPDF = trainingEl ? cleanForPDF(stripTags(trainingEl.innerHTML)) : '';
  const mealEl = document.getElementById(`mealnote-${i}`);
  const mealTextPDF = mealEl ? cleanForPDF(stripTags(mealEl.innerHTML)) : '';
  if(trainingTextPDF || mealTextPDF){
    heading('Training & Meal-Sheet');
    if(trainingTextPDF){
      checkPageBreak(10);
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
      setColor(colKhaki);
      doc.text('TRAINING — BASIS-EMPFEHLUNG', marginX, y);
      y += 4;
      paragraph(trainingTextPDF, {size:9, color:colText, gap:4});
    }
    if(mealTextPDF){
      checkPageBreak(10);
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
      setColor(colKhaki);
      doc.text('MEAL-SHEET HINWEIS', marginX, y);
      y += 4;
      paragraph(mealTextPDF, {size:9, color:colText, gap:4});
    }
  }

  // ── ZUSAMMENFASSUNG (hervorgehoben) ────────────────────────────────────
  const gesamtText = cleanForPDF(stripTags(document.getElementById(`gesamtbox-${i}`).innerHTML));
  const summarySize = 9.3;
  const summaryLineH = summarySize * 0.353 * 1.25;
  doc.setFont('helvetica','normal'); doc.setFontSize(summarySize);
  const summaryLines = gesamtText ? doc.splitTextToSize(gesamtText, contentW-12) : [];
  const summaryH = Math.max(summaryLines.length*summaryLineH + 14, 20);
  checkPageBreak(summaryH+10);
  heading('Zusammenfassung');
  doc.setFillColor(253,250,242);
  doc.setDrawColor(239,230,207);
  doc.setLineWidth(0.5);
  doc.roundedRect(marginX, y, contentW, summaryH, 3, 3, 'FD');
  doc.setDrawColor(colRed[0],colRed[1],colRed[2]);
  doc.setLineWidth(1.2);
  doc.line(marginX, y+1, marginX, y+summaryH-1);
  if(summaryLines.length){
    doc.setFont('helvetica','normal'); doc.setFontSize(summarySize);
    setColor(colText);
    doc.text(summaryLines, marginX+6, y+8);
  }
  y += summaryH + 7;

  // ── NÄCHSTE MESSUNG / TERMINHINWEIS ─────────────────────────────────────
  checkPageBreak(20);
  doc.setFillColor(238,243,238);
  doc.setDrawColor(214,227,214);
  doc.roundedRect(marginX, y, contentW, 17, 2.5, 2.5, 'FD');
  doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
  setColor(colText);
  doc.text(cleanForPDF('Deine nächste Messung sollte in 4–6 Wochen stattfinden.'), marginX+5, y+6.5);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  setColor(colMuted);
  doc.text('Termin gerne per WhatsApp 0170 8152555 oder E-Mail headcoachtobi@gmail.com vereinbaren.', marginX+5, y+12);
  y += 22;

  // Viel-Erfolg-Zeile
  checkPageBreak(10);
  doc.setFont('helvetica','bolditalic'); doc.setFontSize(10);
  setColor(colRed);
  doc.text(cleanForPDF('Viel Erfolg bei der Umsetzung!'), marginX, y);
  y += 8;

  // ── FOOTER (auf jeder Seite) ─────────────────────────────────────────────
  const totalPages = doc.internal.getNumberOfPages();
  for(let p=1;p<=totalPages;p++){
    doc.setPage(p);
    const footerY = pageH - 10;
    doc.setDrawColor(colLine[0],colLine[1],colLine[2]);
    doc.setLineWidth(0.3);
    doc.line(marginX, footerY-4, marginX+contentW, footerY-4);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    setColor(colMuted);
    doc.text('CTB Coaching · headcoachtobi@gmail.com · ypsi.de — Code CTBSTRONG für 5% Rabatt', pageW/2, footerY, {align:'center'});
    doc.text(`Seite ${p} von ${totalPages} · Diese Auswertung ersetzt keine medizinische Beratung.`, pageW/2, footerY+3.5, {align:'center'});
  }

  const safeName=(m.name||'Kunde').replace(/[^a-zA-Z0-9äöüÄÖÜß_-]+/g,'_');
  doc.save(`CTB_Auswertung_${safeName}_M${i+1}.pdf`);
}
// ── KUNDE SPEICHERN / LADEN (JSON-Datei pro Kunde) ───────────────────────
// Speichert Rohdaten (Eingaben), nicht die generierten Texte — beim Laden
// werden alle Messungen automatisch neu berechnet (inkl. evtl. Tool-Updates).
function collectRawInputs(){
  const raw = { ziel: document.getElementById('ziel-0').value, measurementsInput: [] };
  for(let idx=0; idx<6; idx++){
    const weightEl = document.getElementById(`weight-${idx}`);
    if(!weightEl || !weightEl.value) continue; // diese Messung wurde nie ausgefüllt
    const entry = { weight: weightEl.value, mdate: document.getElementById(`mdate-${idx}`).value };
    if(idx===0){
      entry.name = document.getElementById('name-0').value;
      entry.bd = document.getElementById('bd-0').value;
      entry.gender = document.getElementById('gender-0').value;
      entry.height = document.getElementById('height-0').value;
    }
    entry.notes = document.getElementById(`notes-${idx}`)?.value || '';
    entry.vals = {};
    SF.forEach(s=>{ entry.vals[s.id] = document.getElementById(`${s.id}-${idx}`)?.value || ''; });
    raw.measurementsInput.push(entry);
  }
  return raw;
}

function saveCustomerFile(){
  const nameEl = document.getElementById('name-0');
  if(!nameEl || !nameEl.value.trim()){
    alert('Bitte zuerst mindestens Name (Messung 1) eingeben.');
    return;
  }
  const raw = collectRawInputs();
  const json = JSON.stringify(raw, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const safeName = nameEl.value.trim().replace(/[^a-zA-Z0-9äöüÄÖÜß_-]+/g,'_');
  const a = document.createElement('a');
  a.href = url;
  a.download = `CTB_Kunde_${safeName}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  const statusEl = document.getElementById('save-status');
  if(statusEl){
    statusEl.textContent = `Gespeichert: CTB_Kunde_${safeName}.json`;
    setTimeout(()=>{statusEl.textContent='';}, 5000);
  }
}

function loadCustomerFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let raw;
    try{ raw = JSON.parse(e.target.result); }
    catch(err){ alert('Datei konnte nicht gelesen werden — ist es eine gültige CTB-Kunden-Datei?'); return; }
    applyRawInputs(raw);
  };
  reader.readAsText(file);
  event.target.value=''; // erlaubt erneutes Laden derselben Datei
}

function applyRawInputs(raw){
  if(!raw || !raw.measurementsInput || !raw.measurementsInput.length){
    alert('Diese Datei enthält keine Messdaten.');
    return;
  }
  // Reset: alle Tabs zurück auf locked außer Messung 1
  document.querySelectorAll('.tab').forEach((tab,idx)=>{
    if(tab.dataset.tab==='0'){ tab.classList.remove('locked'); tab.classList.add('active'); }
    else { tab.classList.add('locked'); tab.classList.remove('active','has-data'); }
  });
  measurements.fill(null);
  clientData = null;

  raw.measurementsInput.forEach((entry, idx)=>{
    if(idx===0){
      document.getElementById('name-0').value = entry.name || '';
      document.getElementById('bd-0').value = entry.bd || '';
      document.getElementById('gender-0').value = entry.gender || 'm';
      document.getElementById('height-0').value = entry.height || '';
      document.getElementById('ziel-0').value = raw.ziel || '';
    }
    document.getElementById(`weight-${idx}`).value = entry.weight || '';
    document.getElementById(`mdate-${idx}`).value = entry.mdate || '';
    const notesEl = document.getElementById(`notes-${idx}`);
    if(notesEl) notesEl.value = entry.notes || '';
    SF.forEach(s=>{
      const inp = document.getElementById(`${s.id}-${idx}`);
      if(inp && entry.vals && entry.vals[s.id]!==undefined){
        inp.value = entry.vals[s.id];
        updBar(s.id, idx);
      }
    });
  });

  // Alle vorhandenen Messungen automatisch neu berechnen (in Reihenfolge,
  // damit Verlaufsvergleiche zur vorherigen Messung korrekt aufgebaut werden)
  raw.measurementsInput.forEach((entry, idx)=>{
    calcMeas(idx);
    backToForm(idx); // Eingabemaske zeigen, Ergebnis bleibt im Hintergrund berechnet
  });

  // Letzte vorhandene Messung anzeigen
  const lastIdx = raw.measurementsInput.length-1;
  switchTab(lastIdx);
  document.getElementById(`form-${lastIdx}`).style.display='none';
  document.getElementById(`res-${lastIdx}`).style.display='block';

  const statusEl = document.getElementById('save-status');
  if(statusEl){
    statusEl.textContent = `Geladen: ${raw.measurementsInput[0].name || 'Kunde'} (${raw.measurementsInput.length} Messung${raw.measurementsInput.length>1?'en':''})`;
    setTimeout(()=>{statusEl.textContent='';}, 6000);
  }
}

function clearMeas(i){
  if(!confirm('Eingaben für diese Messung löschen?'))return;
  if(i===0){['name-0','bd-0','weight-0','height-0','ziel-0'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});document.getElementById('gender-0').value='m';}
  else{document.getElementById(`weight-${i}`).value='';}
  document.getElementById(`mdate-${i}`).valueAsDate=new Date();
  document.getElementById(`notes-${i}`).value='';
  SF.forEach(s=>{const inp=document.getElementById(`${s.id}-${i}`);if(inp)inp.value='';const bar=document.getElementById(`b_${s.id}_${i}`);if(bar)bar.style.width='0%';});
}

buildAll();
for(let i=0;i<6;i++) buildSFGrid(i);
</script>
